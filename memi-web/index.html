<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--bg2:#f7f7f8;--bg3:#ececf1;--text:#171717;--dim:#676767;--dim2:#8e8ea0;--border:#e5e5e5;--hover:#f5f5f5;--sidebar:#f0f0f0;--radius:12px;--blue:#10a37f;--danger:#ef4444}
html,body,#root{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::selection{background:#c7d2fe}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.app{display:flex;height:100%;height:100dvh}

/* Dark theme */
[data-theme="dark"]{--bg:#171717;--bg2:#212121;--bg3:#2f2f2f;--text:#ececec;--dim:#9a9a9a;--dim2:#6b6b6b;--border:#3a3a3a;--hover:#2a2a2a;--sidebar:#1e1e1e}
[data-theme="dark"] .msg-content pre{background:#0d0d0d}
[data-theme="dark"] .tool-call{background:#0c2d48;border-color:#1e5a8a;color:#7dd3fc}
[data-theme="dark"] .modal-input{background:#2a2a2a;border-color:#3a3a3a;color:var(--text)}
[data-theme="dark"] input,[data-theme="dark"] textarea{background:#2a2a2a;border-color:#3a3a3a;color:var(--text)}

/* ===== Sidebar ===== */
.sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:margin-left .3s}
.sidebar-header{padding:12px;display:flex;flex-direction:column;gap:8px}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-weight:600;font-size:15px;cursor:default}
.sidebar-brand svg{width:24px;height:24px;flex-shrink:0}
.sidebar-actions{display:flex;flex-direction:column;gap:2px}
.sidebar-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:none;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text);text-align:left;width:100%;transition:background .1s}
.sidebar-btn:hover{background:rgba(128,128,128,.15)}
.sidebar-btn svg{width:18px;height:18px;flex-shrink:0;opacity:.7}
.sidebar-search{margin:4px 12px 8px;position:relative}
.sidebar-search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);outline:none;color:var(--text)}
.sidebar-search input:focus{border-color:#999}
.sidebar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.4}
.sidebar-label{font-size:12px;font-weight:600;color:var(--dim2);padding:12px 16px 6px;text-transform:uppercase;letter-spacing:.3px}
.sidebar-list{flex:1;overflow-y:auto;padding:0 8px}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);transition:background .1s;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-item:hover{background:rgba(128,128,128,.12)}
.sidebar-item.active{background:rgba(128,128,128,.18);font-weight:500}
.sidebar-item-text{flex:1;overflow:hidden;text-overflow:ellipsis}
.sidebar-item-del{opacity:0;padding:2px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--dim);border-radius:4px;flex-shrink:0}
.sidebar-item:hover .sidebar-item-del{opacity:1}
.sidebar-item-del:hover{background:rgba(128,128,128,.2)}
.sidebar-footer{border-top:1px solid var(--border);padding:8px}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.sidebar-user:hover{background:rgba(128,128,128,.12)}
.sidebar-avatar{width:32px;height:32px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.sidebar-user-info{flex:1;min-width:0}
.sidebar-user-name{font-size:13px;font-weight:500}
.sidebar-user-plan{font-size:11px;color:var(--dim2)}

/* ===== Main ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.main-header{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.menu-btn{display:none;background:none;border:none;cursor:pointer;padding:6px;border-radius:6px}
.menu-btn:hover{background:var(--hover)}
.menu-btn svg{width:20px;height:20px;color:var(--text)}
.model-select{display:flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;font-size:14px;font-weight:500;color:var(--text)}
.model-select:hover{background:var(--hover)}
.model-arrow{font-size:10px;opacity:.5}
.header-spacer{flex:1}
.header-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:var(--hover)}
.header-btn svg{width:20px;height:20px;color:var(--dim)}

/* ===== Content Area ===== */
.content{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.content-inner{max-width:768px;width:100%;margin:0 auto;padding:0 16px;flex:1;display:flex;flex-direction:column}

/* Empty State */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:24px}
.empty-title{font-size:28px;font-weight:600;color:var(--text);text-align:center}
.quick-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.quick-chip{display:flex;align-items:center;gap:6px;padding:10px 16px;border:1px solid var(--border);border-radius:999px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--text);transition:all .15s}
.quick-chip:hover{border-color:#999;background:var(--hover)}
.quick-chip svg{width:16px;height:16px;opacity:.6}

/* Messages */
.messages{flex:1;padding:20px 0}
.msg{display:flex;gap:12px;padding:16px 0;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;background:var(--bg3);color:var(--text)}
.msg.user .msg-avatar{background:var(--text);color:var(--bg)}
.msg-body{flex:1;min-width:0}
.msg-content{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg-content code{background:rgba(128,128,128,.15);padding:2px 5px;border-radius:4px;font-size:13px;font-family:"JetBrains Mono","SF Mono",monospace}
.msg-content pre{background:#1e1e2e;color:#cdd6f4;padding:14px;border-radius:10px;overflow-x:auto;font-size:13px;margin:10px 0;font-family:"JetBrains Mono","SF Mono",monospace}
.msg-content pre code{background:none;padding:0;color:inherit}
.msg-content table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
.msg-content th,.msg-content td{border:1px solid var(--border);padding:7px 12px;text-align:left}
.msg-content th{background:var(--bg3);font-weight:600}
.msg-content a{color:#2563eb;text-decoration:none}
.msg-content a:hover{text-decoration:underline}
.msg-content ul,.msg-content ol{padding-left:20px;margin:6px 0}
.msg-content li{margin:3px 0}

/* Tool calls */
.tool-call{display:flex;align-items:center;gap:6px;padding:8px 12px;margin:8px 0;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;font-size:12px;color:#0369a1;cursor:pointer;transition:background .1s}
.tool-call:hover{background:#e0f2fe}
.tool-call-icon{font-size:14px}
.tool-call-name{font-weight:500;flex:1}
.tool-call-arrow{font-size:10px;transition:transform .2s}
.tool-call.open .tool-call-arrow{transform:rotate(180deg)}
.tool-call-result{display:none;margin-top:6px;padding:10px;background:var(--bg);border-radius:6px;font-size:11px;max-height:200px;overflow-y:auto;white-space:pre-wrap;color:var(--text);border:1px solid var(--border)}
.tool-call.open .tool-call-result{display:block}

/* Message Actions */
.msg-actions{display:flex;gap:2px;margin-top:6px;opacity:0;transition:opacity .15s}
.msg:hover .msg-actions{opacity:1}
.msg-action{background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.msg-action:hover{background:var(--hover);color:var(--text)}
.msg-action.active{color:var(--blue)}
.msg-action svg{width:16px;height:16px}

/* Typing */
.typing-indicator{display:flex;gap:4px;padding:12px 16px}
.typing-dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);animation:bounce 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ===== Input Area ===== */
.input-area{border-top:1px solid var(--border);padding:12px 16px 16px;flex-shrink:0}
.input-container{max-width:768px;margin:0 auto}
.input-box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--border);border-radius:16px;padding:8px 12px;background:var(--bg);transition:border-color .15s}
.input-box:focus-within{border-color:#999}
.input-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--dim)}
.input-btn:hover{background:var(--hover);color:var(--text)}
.input-btn svg{width:20px;height:20px}
.input-textarea{flex:1;border:none;outline:none;resize:none;font-size:15px;font-family:inherit;line-height:1.5;max-height:200px;background:transparent;color:var(--text)}
.input-textarea::placeholder{color:var(--dim2)}
.send-btn{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.send-btn.ready{background:var(--text);color:var(--bg)}
.send-btn.ready:hover{opacity:.8}
.send-btn.empty{background:var(--bg3);color:var(--dim2);cursor:default}
.send-btn:disabled{opacity:.5;cursor:default}
.send-btn svg{width:18px;height:18px}
.input-disclaimer{text-align:center;font-size:11px;color:var(--dim2);margin-top:8px}

/* Connection status */
.conn-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer}
.conn-badge.on{background:#dcfce7;color:#166534}
.conn-badge.off{background:#fee2e2;color:#991b1b}
.conn-badge:hover{opacity:.8}
.conn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.conn-badge.on .conn-dot{background:#22c55e}
.conn-badge.off .conn-dot{background:#ef4444}

/* ===== Settings Panel ===== */
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;backdrop-filter:blur(2px)}
.settings-overlay.show{display:flex;justify-content:flex-end}
.settings-panel{width:420px;max-width:100%;height:100%;background:var(--bg);overflow-y:auto;animation:slideIn .25s;padding:0}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.settings-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:1}
.settings-title{font-size:18px;font-weight:600}
.settings-close{background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--dim);font-size:20px}
.settings-close:hover{background:var(--hover)}
.settings-body{padding:20px}
.settings-section{margin-bottom:28px}
.settings-section-title{font-size:13px;font-weight:600;color:var(--dim2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:12px}
.settings-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:14px;color:var(--text)}
.settings-row-desc{font-size:12px;color:var(--dim2);margin-top:2px}
.settings-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;margin-top:8px}
.settings-input:focus{border-color:#999}
.settings-textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;background:var(--bg);color:var(--text);outline:none;margin-top:8px;min-height:80px;resize:vertical;font-family:inherit;line-height:1.5}
.settings-textarea:focus{border-color:#999}
.settings-select{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.settings-select:focus{border-color:#999}
.settings-slider{-webkit-appearance:none;width:120px;height:4px;border-radius:2px;background:var(--border);outline:none}
.settings-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);cursor:pointer}
.settings-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg);cursor:pointer;transition:all .15s}
.settings-tag:hover{border-color:#999}
.settings-tag.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.settings-btn{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--text);text-align:center;transition:all .15s}
.settings-btn:hover{background:var(--hover);border-color:#999}
.settings-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.settings-hint{font-size:12px;color:var(--dim2);margin-top:8px;line-height:18px}
.settings-divider{height:1px;background:var(--border);margin:20px 0}
.settings-danger{color:var(--danger);cursor:pointer;padding:8px 16px;border:1px solid var(--danger);border-radius:8px;background:none;font-size:13px;width:100%;text-align:center;transition:all .15s}
.settings-danger:hover{background:var(--danger);color:#fff}

/* ===== Responsive ===== */
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:100;margin-left:-260px}
  .sidebar.open{margin-left:0;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .sidebar-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
  .sidebar-mask.show{display:block}
  .menu-btn{display:flex}
  .content-inner{padding:0 12px}
  .input-area{padding:10px 12px 14px}
  .empty-title{font-size:22px}
  .model-select{font-size:13px;padding:5px 10px}
  .settings-panel{width:100%}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ===== State =====
let serverUrl = localStorage.getItem("memi-url") || "";
let sessions = JSON.parse(localStorage.getItem("memi-sessions") || "[]");
let currentSessionId = localStorage.getItem("memi-current") || "";
let messages = [];
let streaming = false;
let streamText = "";
let showSettings = false;
let settingsTab = "connection";
let sidebarOpen = false;
let searchQuery = "";
let draftText = "";
let lastStreamUpdate = 0;
let showTodoPanel = false;
let showTodoInput = false;
let todos = [];
let todoPollTimer = null;

// Settings
let settings = JSON.parse(localStorage.getItem("memi-settings") || "{}");
if (!settings.model) settings.model = "";
if (!settings.persona) settings.persona = "default";
if (!settings.temperature) settings.temperature = 0.7;
if (!settings.theme) settings.theme = "light";
if (!settings.systemPrompt) settings.systemPrompt = "";
if (!settings.apiKeys) settings.apiKeys = {};
if (!settings.voiceEnabled) settings.voiceEnabled = false;

// Personas
const PERSONAS = [
  { id: "default", name: "默认助手", desc: "通用 AI 助手" },
  { id: "coder", name: "程序员", desc: "专注代码与调试" },
  { id: "poet", name: "诗人", desc: "文艺范，诗词歌赋" },
  { id: "teacher", name: "老师", desc: "耐心讲解，深入浅出" },
  { id: "friend", name: "老友", desc: "轻松聊天" },
  { id: "boss", name: "老板", desc: "强势直接" },
];

// Models
const MODELS = [
  { id: "gpt-4o", name: "GPT-4o", desc: "OpenAI" },
  { id: "gpt-4o-mini", name: "GPT-4o Mini", desc: "OpenAI 轻量" },
  { id: "claude-sonnet-4-20250514", name: "Claude Sonnet 4", desc: "Anthropic" },
  { id: "gemini-2.5-pro", name: "Gemini 2.5 Pro", desc: "Google" },
  { id: "deepseek-chat", name: "DeepSeek Chat", desc: "深度求索" },
  { id: "deepseek-reasoner", name: "DeepSeek Reasoner", desc: "深度求索推理" },
  { id: "meta/llama-3.3-70b-instruct", name: "Llama 3.3 70B", desc: "Meta 开源" },
  { id: "qwen-max", name: "Qwen Max", desc: "阿里云" },
];

// ===== Init =====
if (!sessions.length) newSession();
applyTheme(settings.theme);

function newSession() {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  sessions.unshift({ id, title: "新对话", time: Date.now(), messages: [] });
  currentSessionId = id;
  messages = [];
  saveAll();
}

function loadSession(id) {
  saveCurrent();
  currentSessionId = id;
  const s = sessions.find(x => x.id === id);
  messages = s ? JSON.parse(JSON.stringify(s.messages)) : [];
  sidebarOpen = false;
  render();
}

function saveCurrent() {
  const s = sessions.find(x => x.id === currentSessionId);
  if (s) {
    s.messages = messages;
    if (messages.length && !s.titleChanged) {
      const first = messages.find(m => m.role === "user");
      if (first) s.title = first.content.slice(0, 30) + (first.content.length > 30 ? "..." : "");
    }
    s.time = Date.now();
    sessions.sort((a,b) => b.time - a.time);
  }
  saveAll();
}

function deleteSession(id, e) {
  e.stopPropagation();
  sessions = sessions.filter(x => x.id !== id);
  if (currentSessionId === id) {
    if (sessions.length) loadSession(sessions[0].id);
    else { newSession(); render(); }
  } else render();
  saveAll();
}

function saveAll() {
  localStorage.setItem("memi-sessions", JSON.stringify(sessions));
  localStorage.setItem("memi-current", currentSessionId);
  localStorage.setItem("memi-settings", JSON.stringify(settings));
}

// ===== Helpers =====
const $ = s => document.querySelector(s);
const esc = t => (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
function timeStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function applyTheme(theme) {
  if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else if (theme === "light") document.documentElement.removeAttribute("data-theme");
  else if (theme === "system") {
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
  }
}

// ===== Server Config =====
let serverConfig = {};

async function loadServerConfig() {
  if (!serverUrl) return;
  try {
    const r = await fetch(serverUrl + "/api/config", { signal: AbortSignal.timeout(5000), headers: { "ngrok-skip-browser-warning": "1" } });
    serverConfig = await r.json();
    saveAll();
  } catch {}
}

async function saveServerConfig(patch) {
  if (!serverUrl) return false;
  try {
    const r = await fetch(serverUrl + "/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" },
      body: JSON.stringify(patch),
      signal: AbortSignal.timeout(5000)
    });
    const d = await r.json();
    if (d.success) serverConfig = d.config;
    return d.success;
  } catch { return false; }
}

// ===== API =====
async function health(url) {
  try { const r = await fetch(url + "/health", { signal: AbortSignal.timeout(5000) }); const d = await r.json(); return d?.status === "ok"; } catch { return false; }
}

async function sendMsg(text) {
  const c = text.trim();
  if (!c || !serverUrl || streaming) return;
  messages.push({ role: "user", content: c, time: timeStr() });
  setInput("");
  streaming = true;
  streamText = "";
  messages.push({ role: "assistant", content: "", time: timeStr(), tools: [] });
  render();
  scrollBottom();

  // Build system prompt
  let sysContent = settings.systemPrompt || "";
  const persona = PERSONAS.find(p => p.id === settings.persona);
  if (persona && persona.id !== "default") {
    sysContent = (sysContent ? sysContent + "\n\n" : "") + `你是一个${persona.name}角色。${persona.desc}。`;
  }

  const apiMessages = [];
  if (sysContent) apiMessages.push({ role: "system", content: sysContent });
  messages.forEach(m => {
    if (m.content) apiMessages.push({ role: m.role, content: m.content });
  });

  try {
    const r = await fetch(serverUrl + "/api/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" },
      body: JSON.stringify({ model: settings.model, messages: apiMessages, temperature: settings.temperature, stream: true })
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop() || "";
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const d = line.slice(6).trim();
        if (d === "[DONE]") continue;
        try {
          const p = JSON.parse(d);
          if (p.type === "tool_call" || p.tool) {
            const name = p.tool || p.type || "tool";
            let args = "";
            try { const a = typeof p.args === "string" ? JSON.parse(p.args) : p.args; args = Object.values(a||{}).join(", "); } catch { args = String(p.args||""); }
            const last = messages[messages.length - 1];
            if (!last.tools) last.tools = [];
            last.tools.push({ name, args, result: String(p.result||"").slice(0, 500) });
            render(); continue;
          }
          const delta = p.choices?.[0]?.delta?.content;
          if (delta) {
            streamText += delta;
            messages[messages.length - 1].content = streamText;
            const now = Date.now();
            if (now - lastStreamUpdate > 40) {
              lastStreamUpdate = now;
              const el = document.getElementById("msg-content-last");
              if (el) { el.innerHTML = md(streamText); scrollBottom(); }
              else { render(); scrollBottom(); }
            }
          }
        } catch {}
      }
    }
  } catch(e) {
    messages[messages.length - 1].content = "请求失败: " + e.message;
  }
  streaming = false;
  render();
  saveCurrent();
}

function copyMsg(text) { navigator.clipboard.writeText(text).catch(() => {}); }

function resendMsg(idx) {
  if (streaming) return;
  if (idx < 1) return;
  const userMsg = messages[idx - 1];
  if (!userMsg || userMsg.role !== "user") return;
  messages.splice(idx);
  sendMsg(userMsg.content);
}

// ===== Markdown =====
function md(t) {
  let s = esc(t);
  const codeBlocks = [];
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => { codeBlocks.push(c); return `%%CODEBLOCK${codeBlocks.length-1}%%`; });
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  s = s.replace(/\*(.+?)\*/g, "<i>$1</i>");
  s = s.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  s = s.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  s = s.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  s = s.replace(/^- (.+)$/gm, "• $1");
  s = s.replace(/\n/g, "<br>");
  codeBlocks.forEach((c, i) => { s = s.replace(`%%CODEBLOCK${i}%%`, `<pre><code>${c}</code></pre>`); });
  return s;
}

function scrollBottom() {
  setTimeout(() => { const c = $(".content"); if (c) c.scrollTop = c.scrollHeight; }, 10);
}

function setInput(v) {
  draftText = v;
  const ta = $("#inputArea");
  if (ta) { ta.value = v; ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 200) + "px"; }
}

  html += `</div>`;
  root.innerHTML = html;

  const ta = $("#inputArea");
  if (ta) {
    ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(ta.value); } };
    ta.oninput = function() { draftText = this.value; this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 200) + "px"; updateSendBtn(); };
    if (draftText && !streaming) { ta.value = draftText; ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 200) + "px"; }

function updateSendBtn() {
  const ta = $("#inputArea");
  const btn = $("#sendBtn");
  if (ta && btn) btn.className = "send-btn " + (ta.value.trim() ? "ready" : "empty");
}

async function doConnect() {
  const url = $("#urlInput")?.value?.trim();
  if (!url) return;
  const s = $("#connStatus");
  if (s) { s.textContent = "正在连接..."; s.className = "modal-status"; }
  const ok = await health(url);
  if (ok) {
    serverUrl = url;
    localStorage.setItem("memi-url", url);
    await loadServerConfig();
    showSettings = false;
    render();
  } else {
    serverUrl = "";
    localStorage.removeItem("memi-url");
    if (s) { s.textContent = "连接失败"; s.className = "modal-status err"; }
  }
}

async function setModel(modelId) {
  settings.model = modelId;
  saveAll();
  const providers = serverConfig.providers || {};
  let matched = false;
  for (const [id, cfg] of Object.entries(providers)) {
    if (cfg.model === modelId) {
      await saveServerConfig({ api1: { baseUrl: cfg.baseUrl, model: cfg.model, apiKey: cfg.apiKey } });
      settings.activeProvider = id;
      matched = true;
      break;
    }
  }
  if (!matched) {
    await saveServerConfig({ api1: { ...serverConfig.api1, model: modelId } });
  }
  saveAll();
  render();
}

async function setPersona(personaId) {
  settings.persona = personaId;
  saveAll();
  await saveSystemPromptToServer();
  render();
}

let systemPromptTimer = null;
async function saveSystemPrompt(prompt) {
  settings.systemPrompt = prompt;
  saveAll();
  if (systemPromptTimer) clearTimeout(systemPromptTimer);
  systemPromptTimer = setTimeout(() => saveSystemPromptToServer(), 500);
}

async function saveSystemPromptToServer() {
  let sysContent = settings.systemPrompt || "";
  const persona = PERSONAS.find(p => p.id === settings.persona);
  if (persona && persona.id !== "default") {
    sysContent = (sysContent ? sysContent + "\n\n" : "") + `你是一个${persona.name}角色。${persona.desc}。`;
  }
  await saveServerConfig({ agents: [{ name: "default", model: settings.model, systemPrompt: sysContent }] });
}

async function activateProvider(provId) {
  const providers = serverConfig.providers || {};
  const cfg = providers[provId];
  if (!cfg?.baseUrl) { alert("请先填写 Base URL"); return; }
  if (!cfg?.apiKey) { alert("请先填写 API Key"); return; }
  settings.model = cfg.model;
  settings.activeProvider = provId;
  saveAll();
  await saveServerConfig({ api1: { baseUrl: cfg.baseUrl, model: cfg.model, apiKey: cfg.apiKey } });
  await loadServerConfig();
  render();
}

async function removeProvider(provId) {
  if (!confirm("确定删除此提供商？")) return;
  const providers = serverConfig.providers || {};
  delete providers[provId];
  if (settings.activeProvider === provId) {
    settings.activeProvider = "";
    settings.model = "";
  }
  saveAll();
  await saveServerConfig({ providers });
  await loadServerConfig();
  render();
}

function addProvider(provId) {
  const providers = serverConfig.providers || {};
  if (providers[provId]) return;
  const ALL_PROVIDERS = {
    openai: { url: "https://api.openai.com/v1", model: "gpt-4o" },
    anthropic: { url: "https://api.anthropic.com/v1", model: "claude-sonnet-4-20250514" },
    gemini: { url: "https://generativelanguage.googleapis.com/v1beta/openai", model: "gemini-2.5-pro" },
    groq: { url: "https://api.groq.com/openai/v1", model: "llama-3.3-70b-versatile" },
    deepseek: { url: "https://api.deepseek.com/v1", model: "deepseek-chat" },
    openrouter: { url: "https://openrouter.ai/api/v1", model: "openai/gpt-4o" },
    together: { url: "https://api.together.xyz/v1", model: "meta-llama/Llama-3.3-70B-Instruct-Turbo" },
    perplexity: { url: "https://api.perplexity.ai", model: "llama-3.1-sonar-large-128k-online" },
    cohere: { url: "https://api.cohere.com/v2", model: "command-r-plus" },
    mistral: { url: "https://api.mistral.ai/v1", model: "mistral-large-latest" },
    xai: { url: "https://api.x.ai/v1", model: "grok-3" },
    cloudflare: { url: "https://api.cloudflare.com/client/v4", model: "@cf/meta/llama-3.3-70b-instruct-fp16" },
    alibaba: { url: "https://dashscope.aliyuncs.com/compatible-mode/v1", model: "qwen-max" },
    zhipu: { url: "https://open.bigmodel.cn/api/paas/v4", model: "glm-4-plus" },
    volcengine: { url: "https://ark.cn-beijing.volces.com/api/v3", model: "doubao-pro-256k" },
    kimi: { url: "https://api.moonshot.cn/v1", model: "moonshot-v1-128k" },
    siliconflow: { url: "https://api.siliconflow.cn/v1", model: "Qwen/Qwen2.5-72B-Instruct" },
    nvidia: { url: "https://integrate.api.nvidia.com/v1", model: "meta/llama-3.3-70b-instruct" },
    xfyun: { url: "https://spark-api-open.xf-yun.com/v1", model: "4.0Ultra" },
    ollama: { url: "http://localhost:11434/v1", model: "llama3.1:70b" },
    lmstudio: { url: "http://localhost:1234/v1", model: "local-model" },
    custom: { url: "", model: "" },
  };
  const preset = ALL_PROVIDERS[provId] || { url: "", model: "" };
  providers[provId] = { baseUrl: preset.url, model: preset.model, apiKey: "" };
  saveServerConfig({ providers }).then(() => loadServerConfig()).then(() => {
    settings.openProvider = provId;
    render();
  });
}

function addCustomProvider() {
  const id = $("#customId")?.value?.trim();
  const url = $("#customUrl")?.value?.trim();
  const model = $("#customModel")?.value?.trim();
  const key = $("#customKey")?.value?.trim();
  if (!id || !url) { alert("请填写 ID 和 Base URL"); return; }
  const providers = serverConfig.providers || {};
  if (providers[id]) { alert("ID 已存在，请换一个"); return; }
  providers[id] = { baseUrl: url, model: model || "default", apiKey: key || "" };
  saveServerConfig({ providers }).then(() => loadServerConfig()).then(() => {
    if ($("#customId")) $("#customId").value = "";
    if ($("#customUrl")) $("#customUrl").value = "";
    if ($("#customModel")) $("#customModel").value = "";
    if ($("#customKey")) $("#customKey").value = "";
    render();
  });
}

async function saveProvider(provId) {
  const baseUrl = $(`#baseUrl_${provId}`)?.value?.trim() || "";
  const model = $(`#model_${provId}`)?.value?.trim() || "";
  const apiKey = $(`#key_${provId}`)?.value?.trim() || "";

  if (!baseUrl) { alert("请填写 Base URL"); return; }

  const providers = serverConfig.providers || {};
  providers[provId] = { baseUrl, model, apiKey };
  const ok = await saveServerConfig({ providers });
  if (ok) {
    await loadServerConfig();
    // 自动激活：如果没有活跃提供商，或正在编辑的就是当前活跃的
    if (!settings.activeProvider || settings.activeProvider === provId) {
      if (apiKey) {
        settings.model = model;
        settings.activeProvider = provId;
        await saveServerConfig({ api1: { baseUrl, model, apiKey } });
        await loadServerConfig();
      }
    }
    render();
  } else {
    alert("保存失败");
  }
}

// ===== Todo =====
async function loadTodos() {
  if (!serverUrl) { todos = []; return; }
  try { const r = await fetch(serverUrl + "/api/todos", { signal: AbortSignal.timeout(3000) }); todos = await r.json(); } catch { todos = []; }
}
async function saveTodos() {
  if (!serverUrl) return;
  await fetch(serverUrl + "/api/todos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(todos) });
}
async function todoAdd(title) {
  if (!title.trim()) return;
  todos.push({ title: title.trim(), done: false, time: Date.now() });
  await saveTodos();
  render();
}
async function todoToggle(idx) {
  if (todos[idx]) { todos[idx].done = !todos[idx].done; await saveTodos(); render(); }
}
async function todoRemove(idx) {
  todos.splice(idx, 1);
  await saveTodos();
  render();
}
function startTodoPoll() {
  if (todoPollTimer) clearInterval(todoPollTimer);
  todoPollTimer = setInterval(async () => {
    if (!serverUrl) return;
    const prev = JSON.stringify(todos);
    await loadTodos();
    if (JSON.stringify(todos) !== prev) render();
  }, 3000);
}

function toggleVoice() {
  if (!settings.voiceEnabled) { alert("请在设置中启用语音输入"); return; }
  alert("语音输入功能开发中...");
}

// ===== Start =====
loadSession(currentSessionId);
loadTodos().then(() => startTodoPoll());
if (serverUrl) {
  health(serverUrl).then(async ok => {
    if (!ok) { serverUrl = ""; localStorage.removeItem("memi-url"); render(); }
    else { await loadServerConfig(); render(); }
  });
}
render();
